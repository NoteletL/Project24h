<div class="map-container"
  [style.grid-template-columns]="'repeat(' + gridCols + ', var(--tile-size))'"
  [style.grid-template-rows]="'repeat(' + gridRows + ', var(--tile-size))'">
  @for (row of gridArray; track $index; let y = $index) {
    @for (cell of row; track $index; let x = $index) {
      <div class="tile"
        [class]="'tile ' + getCellClass(cell) + (isShipHere(cell) ? ' tile-ship' : '') + (cell?.risk ? ' tile-risk' : '')"
        [title]="cell ? cell.type + ' (' + cell.x + ',' + cell.y + ')' + (cell.islandId ? ' ile:' + cell.islandId : '') + (cell.risk ? ' ⚠RISQUE' : '') : 'Inexploré'">
        {{ getCellIcon(cell) }}
      </div>
    }
  }
</div>
