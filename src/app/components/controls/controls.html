<div class="control-panel">
  <!-- Navigation 8 directions -->
  <div class="nav-controls">
    <div class="nav-row">
      <button class="btn-nav btn-diag" (click)="onAction('NW')" title="Nord-Ouest">↖</button>
      <button class="btn-nav" (click)="onAction('N')" title="Nord (↑/Z)">⬆️ N</button>
      <button class="btn-nav btn-diag" (click)="onAction('NE')" title="Nord-Est">↗</button>
    </div>
    <div class="nav-row">
      <button class="btn-nav" (click)="onAction('W')" title="Ouest (←/Q)">⬅️ W</button>
      <button class="btn-nav btn-center" (click)="onAction('refresh')" title="Rafraîchir (R)">🔄</button>
      <button class="btn-nav" (click)="onAction('E')" title="Est (→/D)">➡️ E</button>
    </div>
    <div class="nav-row">
      <button class="btn-nav btn-diag" (click)="onAction('SW')" title="Sud-Ouest">↙</button>
      <button class="btn-nav" (click)="onAction('S')" title="Sud (↓/S)">⬇️ S</button>
      <button class="btn-nav btn-diag" (click)="onAction('SE')" title="Sud-Est">↘</button>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="action-controls">
    <button class="btn-action btn-build" (click)="onAction('build')" title="Construire le bateau (B)">
      🔨 Construire
    </button>
    <button class="btn-action btn-upgrade" (click)="onAction('upgrade-ship')" title="Améliorer bateau (U)">
      ⬆️ Améliorer bateau
    </button>
    <button class="btn-action btn-islands" (click)="onAction('show-islands')" title="Îles (I)">
      🏝️ Îles
    </button>
    <button class="btn-action btn-market" (click)="onAction('show-market')" title="Marketplace (M)">
      🏪 Marketplace
    </button>
    <button class="btn-action btn-taxes" (click)="onAction('show-taxes')" title="Taxes (T)">
      💸 Taxes
    </button>

    <!-- Bot d'achat automatique -->
    <button
      class="btn-action btn-bot"
      [class.btn-bot--running]="bot.isRunning()"
      (click)="bot.toggle()"
      [attr.aria-pressed]="bot.isRunning()"
      [title]="bot.isRunning() ? 'Arrêter le bot (P)' : 'Démarrer le bot d\'achat auto (P)'"
      [attr.aria-label]="bot.isRunning() ? 'Bot de spéculation actif — cliquer pour arrêter' : 'Bot de spéculation inactif — cliquer pour démarrer'">
      {{ bot.isRunning() ? '🤖 Bot ON' : '🤖 Bot OFF' }}
    </button>

    <!-- Profil de risque -->
    <div class="form-row bot-risk" role="group" aria-labelledby="risk-label">
      <label id="risk-label" for="risk-profile">Profil de risque</label>
      <select
        id="risk-profile"
        [ngModel]="bot.riskProfile()"
        (ngModelChange)="bot.setRiskProfile($event)"
        [disabled]="bot.isRunning()"
        aria-describedby="risk-hint">
        @for (p of riskProfiles; track p.value) {
          <option [value]="p.value">{{ p.label }}</option>
        }
      </select>
      <small id="risk-hint">Fraction du solde utilisée par cycle du bot.</small>
    </div>

    <app-help-panel />
  </div>

  <!-- Statut bot + signaux (annoncés aux lecteurs d'écran) -->
  @if (bot.lastStatus()) {
    <div class="bot-status" aria-live="polite" aria-atomic="true">
      {{ bot.lastStatus() }}
    </div>
  }

  @if (bot.isRunning() && bot.signals().length) {
    <ul class="bot-signals" aria-label="Signaux de spéculation en cours" aria-live="polite">
      @for (sig of bot.signals(); track sig) {
        <li>{{ sig }}</li>
      }
    </ul>
  }
</div>
